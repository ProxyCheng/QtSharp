name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate required project files
        shell: pwsh
        run: |
          $required = @('LICENSE', 'NOTICE.md', 'CONTRIBUTING.md', 'CODE_OF_CONDUCT.md', 'SECURITY.md', 'CHANGELOG.md', 'QtSharp.slnx')
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required file: $path" }
          }
      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          foreach ($path in @('tools/regen-api.ps1', 'tools/run-window-tests.ps1', 'tools/pack-qt-tools.ps1', 'tools/pack-qt-binding.ps1', 'tools/test-packages.ps1', 'tools/build-qt-kit.ps1', 'tools/build-native-module.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null

            if ($errors.Count -gt 0) { $errors | Format-List | Out-Host; throw "PowerShell parse failed: $path" }
          }
      - name: Build tools project
        run: dotnet build tools/QtSharp.Tools/QtSharp.Tools.csproj -c Release --nologo
      - name: Check whitespace
        shell: pwsh
        run: git diff --check

  # Proves the binding still builds from the checked-in model on a machine that has nothing Qt
  # installed: the generator runs from model/qtsharp.api.json (no clang needed), the Qt dev files
  # are fetched from Qt's own repository, and the native wrapper is compiled with the MSVC tools
  # that ship with the runner. The result is the QtSharp.Api package a consumer installs.
  binding:
    name: Build the binding package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the generator
        run: dotnet build gen/gen.csproj -c Release --nologo

      - name: Generate the bindings from the checked-in models
        shell: pwsh
        run: |
          # qtgen resolves its arguments against the working directory, so anchor them at the
          # repository root rather than at the generator's own output folder.
          $root = $env:GITHUB_WORKSPACE
          $genBin = Join-Path $root 'gen/bin/Release/net10.0/win-x64'
          $base = @('qtcore', 'qtgui', 'qtwidgets', 'qtnetwork', 'qtsvg', 'qtsvgwidgets',
                    'qtprintsupport', 'qtopengl', 'qtopenglwidgets')
          $addons = @('charts', 'qt3dcore', 'qt3drender', 'qt3dinput', 'qt3dlogic', 'qt3danimation', 'qt3dextras', 'qtmultimedia', 'qtpositioning')
          Push-Location $genBin
          try {
            # The combined model is the extraction gate and the shared native glue's input. The ten
            # base assemblies are generated from the split models, which are checked in.
            & "./qtgen.exe" split-core (Join-Path $root 'model/qtsharp.api.json') (Join-Path $root 'out/split-models')
            if ($LASTEXITCODE -ne 0) { throw "split-core failed" }
            foreach ($module in $base) {
              $fresh = Join-Path $root "out/split-models/qtsharp.$module.json"
              $checked = Join-Path $root "model/qtsharp.$module.json"
              if ((Get-FileHash $fresh).Hash -ne (Get-FileHash $checked).Hash) {
                throw "model/qtsharp.$module.json is stale - run tools/regen-api.ps1 -Adopt and commit it"
              }
            }
            & "./qtgen.exe" codegen (Join-Path $root 'model/qtsharp.api.json') (Join-Path $root 'out/api') --native-only
            if ($LASTEXITCODE -ne 0) { throw "codegen (native glue) failed" }
            foreach ($module in $base + $addons) {
              & "./qtgen.exe" codegen (Join-Path $root "model/qtsharp.$module.json") (Join-Path $root "out/$module") --module $module
              if ($LASTEXITCODE -ne 0) { throw "codegen ($module) failed" }
            }
          } finally { Pop-Location }

      - name: Cache the Qt archives
        uses: actions/cache@v6
        with:
          path: out/qt-cache
          key: qt-6.12.0-msvc2022_64-v1

      - name: Fetch the Qt kit
        shell: pwsh
        # The script exports QT_DIR / QT_RUNTIME_DIR into the environment for the steps below.
        run: ./tools/build-qt-kit.ps1

      - name: Compile the native wrappers
        shell: pwsh
        run: |
          cmd /c build_api.bat
          if ($LASTEXITCODE -ne 0) { throw "build_api.bat failed" }
          foreach ($module in @('charts', 'qt3dcore', 'qt3drender', 'qt3dinput', 'qt3dlogic', 'qt3danimation', 'qt3dextras', 'qtmultimedia', 'qtpositioning')) {
            powershell -NoProfile -File tools\build-native-module.ps1 -Module $module -QtDir "$env:QT_DIR"
            if ($LASTEXITCODE -ne 0) { throw "$module native build failed" }
          }

      # The official Qt3D examples as the extension's conformance suite. They build the scene and
      # assert on it without opening a render loop, so they run on a runner without a GPU.
      - name: Build and run the official Qt3D examples
        shell: pwsh
        run: |
          dotnet build demos.qt3d/QtSharp.Qt3D.Demos.csproj -c Release --nologo "-p:QtRuntimeDir=$env:QT_RUNTIME_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Qt3D demos build failed" }
          ./tools/run-window-tests.ps1 -Exe "demos.qt3d/bin/Release/net10.0/QtSharp.Qt3D.Demos.exe" -Label "qt3d-demos"
          if ($LASTEXITCODE -ne 0) { throw "some Qt3D demos failed" }

      # The official Qt Charts examples, against the separate Charts assembly.
      - name: Build and run the official Qt Charts examples
        shell: pwsh
        run: |
          dotnet build demos.charts/QtSharp.Charts.Demos.csproj -c Release --nologo "-p:QtRuntimeDir=$env:QT_RUNTIME_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Charts demos build failed" }
          ./tools/run-window-tests.ps1 -Exe "demos.charts/bin/Release/net10.0/QtSharp.Charts.Demos.exe" -Label "charts-demos"
          if ($LASTEXITCODE -ne 0) { throw "some Qt Charts demos failed" }


      - name: Pack all packages
        shell: pwsh
        run: |
          ./tools/pack-qt-binding.ps1 -PackageVersion "0.0.0-ci" -QtRuntimeDir "$env:QT_RUNTIME_DIR"
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }

      # Restore and run the packages through the public NuGet path: a source build cannot show a
      # missing package dependency or buildTransitive payload.
      - name: Verify the packages with a consumer
        shell: pwsh
        run: |
          ./tools/test-packages.ps1 -PackageVersion "0.0.0-ci" -PackagesDir out/packages
          if ($LASTEXITCODE -ne 0) { throw "the package consumer failed" }


      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-ci
          path: |
            out/packages/QtSharp.Api.0.0.0-ci.nupkg
            out/packages/QtSharp.Runtime.0.0.0-ci.nupkg
            out/packages/QtSharp.Qt6.0.0.0-ci.nupkg
            out/packages/QtSharp.Charts.0.0.0-ci.nupkg
            out/packages/QtSharp.Charts.Qt6.0.0.0-ci.nupkg
            out/packages/QtSharp.Qt3D.0.0.0-ci.nupkg
            out/packages/QtSharp.Qt3D.Qt6.0.0.0-ci.nupkg
            out/packages/QtSharp.Multimedia.0.0.0-ci.nupkg
            out/packages/QtSharp.Multimedia.Qt6.0.0.0-ci.nupkg
out/packages/QtSharp.Positioning.0.0.0-ci.nupkg
out/packages/QtSharp.Positioning.Qt6.0.0.0-ci.nupkg
          if-no-files-found: error

      # Hand the generated source tree and the native glue to the smoke job so it does not have to
      # regenerate them. The staging directory makes the artifact's layout explicit:
      # out/binding-artifact/api/QtSharp.Api.dll and out/binding-artifact/<module>/generated, which
      # the smoke job restores under out/.
      - name: Stage the generated binding
        shell: pwsh
        run: |
          $stage = "out/binding-artifact"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$stage/api" -Force | Out-Null
          Copy-Item out/api/QtSharp.Api.dll "$stage/api/"
          # The demos reference the QtMultimedia extension project too, so its generated tree and
          # native glue travel with the artifact as well.
          foreach ($module in @('qtcore', 'qtgui', 'qtwidgets', 'qtnetwork', 'qtsvg', 'qtsvgwidgets',
                                'qtprintsupport', 'qtopengl', 'qtopenglwidgets',
                                'qtmultimedia', 'qtpositioning')) {
            Copy-Item "out/$module/generated" "$stage/$module/generated" -Recurse
          }
          Copy-Item out/api-modules "$stage/api-modules" -Recurse

      - name: Upload the generated binding
        uses: actions/upload-artifact@v7
        with:
          name: binding-api
          path: out/binding-artifact
          if-no-files-found: error

  # The conformance suite: every official example this repository has ported, driving the binding
  # on a real event loop. Offscreen is not an option - several examples assert on rendered pixels
  # and one of them crashes without a real platform plugin - so the runner's normal Qt platform
  # is used.
  smoke:
    name: Smoke tests
    needs: binding
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Take the generated binding from the build job
        uses: actions/download-artifact@v8
        with:
          name: binding-api
          # The artifact holds api/ and <module>/generated at its root, so downloading into out/
          # restores the layout QtSharp.Api.props expects.
          path: out

      - name: Cache the Qt archives
        uses: actions/cache@v6
        with:
          path: out/qt-cache
          key: qt-6.12.0-msvc2022_64-v1

      - name: Fetch the Qt kit
        shell: pwsh
        run: ./tools/build-qt-kit.ps1

      - name: Build the examples and the binding tests
        shell: pwsh
        run: |
          # The examples load the Qt runtime, so point them at the kit the build job assembled.
          dotnet build demos/QtSharp.Demos.csproj -c Release --nologo "-p:QtRuntimeDir=$env:QT_RUNTIME_DIR"
          if ($LASTEXITCODE -ne 0) { throw "demos build failed" }
          dotnet build testbind/testbind.csproj -c Release --nologo "-p:QtRuntimeDir=$env:QT_RUNTIME_DIR"
          if ($LASTEXITCODE -ne 0) { throw "testbind build failed" }

      - name: Run every example
        shell: pwsh
        run: |
          # The runner takes the list from the demo library itself, starts the windows a few at a
          # time, retries a teardown race once and prints a failing window's own output.
          ./tools/run-window-tests.ps1 -Exe "testbind/bin/Release/net10.0/testapp.exe" -Label "demos"
          if ($LASTEXITCODE -ne 0) { throw "some demos failed (see the output above)" }
